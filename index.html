<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>payoo Mobile App</title>
    <!-- daisy ui cdn -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css" />
    <!-- tailwind cdn -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#F4F5F7] h-[100vh] flex flex-col justify-center items-center ">
    <div class="mb-8">
        <img src="assets/Logo-full.png" alt="">

    </div>

    <form class="bg-white rounded-2xl p-10 space-y-4 w-[400px]">
        <div>
            <label for="">Mobile Number</label>
            <br>
            <input id="mobile-number" class="bg-[#F4F5F7] mt-2 rounded-2xl w-full p-2" type="text" placeholder='Enter Mobile Number'>
        </div>
        <div>
            <label for="">4 Digit Pin</label>
            <br>
            <input id="pin-number" class="bg-[#F4F5F7] mt-2 rounded-2xl w-full p-2" type="text" placeholder='Enter 4 Digit Pin'>
        </div>
        <button  id="loginBtn" class="btn bg-[#3B25C1] w-full rounded-2xl text-white">Login</button>
    </form>


   <!-- js script -->
    <script src="js/index.js"></script>
</body>

</html>
